<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js"></script>
    <script type="module">
      import { setTab, sendBackendMessage } from "./main.js";
      window.setTab = setTab;
      window.sendBackendMessage = sendBackendMessage;
    </script>
  </head>

  <body>
    <main class="container">
      <h1>shinydisc: sync your brightwheel photos</h1>

      <div class="tab-visible" id="login-tab">
        <form id="login-form">
          <p class="row">
            <input id="email-input" placeholder="Email" />
            <input id="password-input" type="password" placeholder="Password" />
          </p>
          <p class="row">
            <button type="submit">Log In</button>
          </p>
          
          <p class="error" id="login-error-p"></p>
        </form>
      </div>

      <div class="tab-hidden" id="mfa-tab">
        <form id="mfa-form"
          <p class="row">
            <input id="mfa-input" placeholder="2-factor code (email)" />
          </p>
          <p class="row">
            <button type="submit">Submit</button>
          </p>
        </form>
      </div>

      <div class="tab-hidden" id="loggedin-tab">
        <form id="loggedin-form">
          <p class="row">
            <button id="choose-folder-button" type="button">Choose Folder...</button>
          </p>
          <p class="row" id="output-dir-p">
          </>
          <p class="row">
            <button type="submit">Sync</button>
          </p>
          <p class="row">
            <button id="log-out-btn" type="button">Log Out</button>
          </p>
        </form>
      </div>

      <div class="tab-hidden" id="syncing-tab">
        <form id="syncing-form">
          <p class="row">
            Syncing...
          </p>
          <p class="row">
            <button type="submit" id="cancel-sync-btn">Cancel Sync</button>
          </p>
        </form>
      </div>
      <div id="message-div">
          <p class="row" id="message-p"></p>
      </div>
    </main>
  </body>
</html>
