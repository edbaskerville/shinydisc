<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <style>
    	#sync-button {
    		border: solid 3px black;
    		font-size: 1.4em;
    	}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shinydisc | Logged In</title>
    <script src="/main.js"></script>
    <script>
      /**
        Choose output path using the system file chooser.
      */
      async function chooseOutputPath() {
        let outputDirEl = document.querySelector("#output-dir-p");
        const output_dir = await tauri.dialog.open({
          multiple: false,
          directory: true,
          defaultPath: outputDirEl.innerText,
        });
        if(output_dir) {
          outputDirEl.innerText = output_dir;
          sendBackendMessage({"SetOutputDir" : output_dir});
        }
      }

      function setUpdateAllMetadata() {
        sendBackendMessage({"SetUpdateAllMetadata" : document.querySelector("#metadata-checkbox").checked});
      }

      function setGPSCoords() {
        sendBackendMessage({"SetGPSCoords" : document.querySelector("#gps-input").value});
      }

      function logOut() {
        sendBackendMessage({"LogOut" : null});
      }

      function sync() {
        sendBackendMessage({"Sync" : null});
      }

      function updateConfig() {
        invoke("get_config_tauri").then(config => {
          console.log("Got config", config);
          document.querySelector("#output-dir-p").innerText = config.output_dir;
          document.querySelector("#gps-input").value = config.gps_coords;
          document.querySelector("#metadata-checkbox").checked = config.update_all_metadata;
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        updateConfig();
      });
    </script>
  </head>

  <body>
    <main class="container">
      <h1>shinydisc</h1>
			<p>
				Folder where your photos/videos will be stored:<br>
				<span id="output-dir-p"></span><br>
				<button id="choose-folder-button" type="button" onmouseup="chooseOutputPath();">Choose Folder...</button><br>
				(Sub-folders will be created for each child.)
			</p>
			<hr>
      <p>
      	GPS coordinates for photo metadata (copy/paste from Google Maps etc.):<br>
        <input id="gps-input" placeholder="GPS (lat., lon) - copy/paste from Google Maps" oninput="setGPSCoords();"><br>
        <label><input type="checkbox" id="metadata-checkbox" onchange="setUpdateAllMetadata();">Update GPS coords for already downloaded files</label>
      </p>
			<hr>
      <p>
        <button id="sync-button" type="button" onmouseup="sync();">Sync All Photos and Videos</button>
      </p>
			<hr>
      <p>
      	If you want to switch accounts:<br>
        <button id="sync" type="button" onmouseup="logOut();">Log Out</button><br>
        (Otherwise, just quit, and your login will be remembered when you reopen the app.)
      </p>
    </main>
  </body>
</html>
